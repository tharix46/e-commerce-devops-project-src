# CI for Product Catalog Service

name: product-catalog-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/product-catalog/**"

  push:
    branches:
      - main
    paths:
      - "src/product-catalog/**"

jobs:
  build:
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v2
        with:
          go-version: 1.22

      - name: Build
        run: |
          cd src/product-catalog
          go mod download
          go build -o product-catalog-service main.go

      - name: unit tests
        run: |
          cd src/product-catalog
          go test ./...

  code-quality:
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v2
        with:
          go-version: 1.22

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.55.2
          run: golangci-lint run
          working-directory: src/product-catalog

  docker:
    runs-on: ubuntu-latest

    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Install Docker
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker Push
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/e-commerce-devops-project-product-catalog:${{ github.sha }}

  updatek8s:
    runs-on: ubuntu-latest

    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: update k8s deployment manifest
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_PAT }}

        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/tharix46/e-commerce-devops-project-k8s.git
          cd e-commerce-devops-project-k8s

          # Replace the image tag in the deployment file
          sed -i "s|${{ secrets.DOCKER_USERNAME }}/e-commerce-devops-project-product-catalog:.*|${{ secrets.DOCKER_USERNAME }}/e-commerce-devops-project-product-catalog:${{ github.sha }}|g" productcatalog/deploy.yaml

          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add productcatalog/deploy.yaml
          git diff --cached --exit-code || git commit -m "ci: update product-catalog image tag to ${{ github.sha }}"
          git push
