# CI for Product Catalog Service

name: product-catalog-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/product-catalog/**"

  push:
    branches:
      - main
    paths:
      - "src/product-catalog/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go 1.22
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.22

      - name: Build
        run: |
          cd src/product-catalog
          go mod download
          go build -o product-catalog-service main.go

      - name: unit tests
        run: |
          cd src/product-catalog
          go test ./...

  code-quality:
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go 1.22
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.22

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.55.2
          run: golangci-lint run
          working-directory: src/product-catalog

  docker:
    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    outputs:
      short_sha: ${{ steps.short-sha.outputs.short_sha }}

    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set short SHA
        id: short-sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/e-commerce-devops-project-product-catalog:${{ steps.short-sha.outputs.short_sha }}

  updatek8s:
    runs-on: ubuntu-latest

    needs: docker

    if: github.event_name == 'push'

    steps:
      - name: update k8s deployment manifest
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_PAT }}
          SHORT_SHA: ${{ needs.docker.outputs.short_sha }}

        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/tharix46/e-commerce-devops-project-k8s.git
          cd e-commerce-devops-project-k8s

          # Replace the image tag in the deployment file
          sed -i "s|${{ secrets.DOCKER_USERNAME }}/e-commerce-devops-project-product-catalog:.*|${{ secrets.DOCKER_USERNAME }}/e-commerce-devops-project-product-catalog:${SHORT_SHA}|g" productcatalog/deploy.yaml

          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add productcatalog/deploy.yaml
          git diff --cached --exit-code || git commit -m "ci: update product-catalog image tag to ${SHORT_SHA} by GHA"
          git push origin main

  Notification:
    needs: [build, code-quality, docker, updatek8s]
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Notify Slack if failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # 4.0.0
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
             "text": "*❌ GitHub Actions Failure*\n\n*Workflow:* ${{ github.workflow }}\n*Repo:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Triggered by:* ${{ github.actor }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
